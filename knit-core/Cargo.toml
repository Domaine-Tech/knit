[package]
name = "knit-core"
version = "0.1.0"
edition = "2021"
description = "Core library for Knit: vault management, markdown processing, and CRDT synchronization"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "fs", "io-util", "macros", "time"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
notify = "6.1"
walkdir = "2.5"
regex = "1.10"
trash = "5.2.9"
iroh = "1.3.0"
mdns-sd = "0.21.5"
blake3 = "1.5"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand = "0.8"
futures = "0.3"

[dev-dependencies]
tempfile = "3.10"
