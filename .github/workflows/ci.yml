name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: knit-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: knit-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Tests unitaires (flatten, LRU, updater)
        run: npm run test:unit

  rust:
    name: Rust (check + test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            knit-app/src-tauri
      - name: Dépendances système (WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
      - name: cargo test --workspace
        run: cargo test --workspace

  # DevSecOps renforcé : audits npm/cargo, licences (cargo-deny), secrets (gitleaks).
  # Bloque le tag/Release si critique.
  devsecops:
    name: DevSecOps (audit + deny + secrets)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: knit-app/package-lock.json
      - name: npm audit (high+)
        working-directory: knit-app
        run: |
          npm ci
          npm audit --audit-level=high

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            knit-app/src-tauri
      # rustsec/audit-check parse du JSON fragile (« Unexpected end of JSON input »).
      # Appel direct : respecte `.cargo/audit.toml` et échoue clairement.
      - name: cargo audit (RUSTSEC)
        run: |
          set -euo pipefail
          test -f Cargo.lock
          cargo install cargo-audit --locked --force
          cargo audit
      - name: cargo deny (advisories + licenses + sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  # Après CI vert sur main/master : crée le tag vX.Y.Z s'il n'existe pas encore,
  # puis déclenche Release via workflow_dispatch.
  # (Un push de tag avec GITHUB_TOKEN ne déclenche PAS d'autres workflows — limite GitHub.)
  tag-if-needed:
    name: Tag SemVer (déclenche Release)
    needs: [frontend, rust, devsecops]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lire la version workspace et tagger si absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version\s*=' Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v${VERSION}"
          echo "Version Cargo.toml = ${VERSION} → tag ${TAG}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Le tag ${TAG} existe déjà — aucune action."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"
          # Déclenchement explicite (workflow_dispatch) — nécessaire avec GITHUB_TOKEN
          gh workflow run Release --repo "${{ github.repository }}" --ref "${TAG}" -f "tag=${TAG}"
          echo "Tag ${TAG} poussé + workflow Release déclenché."
